{% extends "identities/base.html" %}

{% block title %}Send Connection Request | FYP Identity Project{% endblock %}

{% block content %}
    <h1 class="text-2xl font-bold mb-6">Send a Connection Request</h1>

    {% if error %}
        <div class="bg-red-100 text-red-700 px-4 py-2 rounded mb-4">{{ error }}</div>
    {% endif %}

    <form method="post" class="bg-white rounded-lg shadow-sm p-4">
        {% csrf_token %}
        <label class="block text-sm font-medium mb-1" for="recipient_username">Username</label>
        <input type="text" name="recipient_username" id="recipient_username"
               class="w-full border rounded px-3 py-2 mb-4" required>
        <button type="submit" class="text-sm px-3 py-1.5 rounded bg-blue-600 text-white hover:bg-blue-700">Send request</button>
    </form>

    <p class="mt-6">
        <a href="{% url 'connection-request-list' %}" class="text-sm text-gray-500 hover:underline">Back to requests</a>
    </p>
{% endblock %}
