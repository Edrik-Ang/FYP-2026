<!DOCTYPE html>
<html lang="en">
<head>
    <title>Forgot Password</title>
</head>
<body>
    <h1>Forgot your password?</h1>
    <p>Enter your email and we'll send you a link to reset it.</p>

    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit">Send reset link</button>
    </form>

    <a href="{% url 'login' %}">Back to login</a>
</body>
</html>
